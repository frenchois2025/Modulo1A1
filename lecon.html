<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Français A1 · Leçon</title><link rel="stylesheet" href="style.css"></head>
<body><main class="main" style="max-width:1000px;margin:auto"><a href="index-parcours.html" class="sidebar-back">← Parcours</a><div id="app"><p>Chargement…</p></div></main>
<script src="moteur.js"></script><script>
'use strict';
const params=new URLSearchParams(location.search), stage=Number(params.get('etape')), lessonNo=Number(params.get('lecon')); const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function error(msg){app.innerHTML='<div class="ex-card"><h1>Leçon indisponible</h1><p>'+esc(msg)+'</p><a class="check-btn" href="index-parcours.html">Retour au parcours</a></div>';}
function renderExercise(ex,i){const id='ex_'+i, d=ex.data||[]; if(ex.type==='qcm') return `<section class="ex-card"><h2>Exercice ${i+1}</h2><div id="${id}"></div><div class="score-box" id="sc_${i}"><div class="score-emoji" id="sc_${i}-em"></div><div class="score-num" id="sc_${i}-n"></div><div class="score-msg" id="sc_${i}-m"></div></div></section>`; if(ex.type==='fill') return `<section class="ex-card"><h2>Exercice ${i+1}</h2><div id="${id}"></div><button class="check-btn" onclick="checkFill('${id}')">Vérifier</button></section>`; if(ex.type==='match') return `<section class="ex-card"><h2>Exercice ${i+1}</h2><div id="${id}"></div></section>`; if(ex.type==='wordCards') return `<section class="ex-card"><h2>Exercice ${i+1}</h2><div class="phone-grid" id="${id}"></div></section>`; if(ex.type==='alphabet') return `<section class="ex-card"><h2>Exercice ${i+1}</h2><div id="${id}"></div></section>`; if(ex.type==='nasal') return `<section class="ex-card"><h2>Exercice ${i+1}</h2><div id="${id}"></div></section>`; return `<section class="ex-card"><p>Type d’exercice non pris en charge : ${esc(ex.type)}</p></section>`;}
function render(){if(!Number.isInteger(stage)||!Number.isInteger(lessonNo)||stage<1||lessonNo<1)return error('Paramètres URL invalides.'); const L=window.LESSON_DATA; if(!L||L.stage!==stage)return error('Étape inexistante.'); const lesson=L.lessons.find(x=>x.id===lessonNo); if(!lesson)return error('Leçon inexistante dans cette étape.'); app.innerHTML=`<header class="lesson-header"><div class="lesson-meta"><div class="lesson-tag">Étape ${stage} · Leçon ${lessonNo}</div><h1 class="lesson-title">${esc(lesson.title)}</h1><p class="lesson-desc">${esc(lesson.objective)}</p></div></header><div class="ex-card"><h2>Explication</h2><p>${esc(lesson.explanation).replace(/\n/g,'<br>')}</p></div>${lesson.exercises.map(renderExercise).join('')}<nav style="display:flex;justify-content:space-between;gap:12px;margin:24px 0"><a class="check-btn" href="?etape=${stage}&lecon=${lessonNo-1}">← Précédente</a><a class="check-btn" href="?etape=${stage}&lecon=${lessonNo+1}">Suivante →</a></nav>`; lesson.exercises.forEach((ex,i)=>{const id='ex_'+i;if(ex.type==='qcm')buildQCM(id,ex.data,'sc_'+i,'var(--l1)');if(ex.type==='fill')buildFill(id,ex.data);if(ex.type==='match')buildMatch(id,ex.data);if(ex.type==='wordCards')buildCards(id,ex.data);if(ex.type==='alphabet')buildAlphabetData(id,ex.data);if(ex.type==='nasal')buildNasalData(id,ex.data);});}
function buildCards(id,data){const c=document.getElementById(id);data.forEach(x=>{const b=document.createElement('button');b.className='phone-card';b.innerHTML=`<div class="phone-fr">${esc(x.fr)}</div><div class="phone-ipa">${esc(x.ipa||'')}</div><div class="phone-es">${esc(x.es||'')}</div>`;b.onclick=()=>speak(x.fr);c.appendChild(b);});}
function buildAlphabetData(id,data){const c=document.getElementById(id);Object.entries(data).forEach(([l,p])=>{const b=document.createElement('button');b.className='phone-card';b.textContent=l;b.onclick=()=>bSpeak(p);c.appendChild(b);});}
function buildNasalData(id,data){const c=document.getElementById(id);data.forEach(n=>{const d=document.createElement('div');d.className='liaison-card';d.innerHTML='<b>'+esc(n.comb)+'</b> '+n.words.map(w=>`<button class="mini-btn" onclick="speak('${String(w.fr).replace(/'/g,"\\'")}')">${esc(w.fr)} — ${esc(w.es)}</button>`).join(' ');c.appendChild(d);});}
const js=document.createElement('script');js.src='contenu/etape'+stage+'.js';js.onload=render;js.onerror=()=>error('Fichier de contenu introuvable.');document.head.appendChild(js);
</script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}' crossorigin="anonymous"></script>
</body></html>
