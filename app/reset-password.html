<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña · Frenchois</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#f7f4ef;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:48px 40px;width:min(440px,100%);box-shadow:0 8px 40px rgba(0,0,0,.1)}
.logo{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;text-align:center;margin-bottom:6px;color:#1c1c2e}
.logo span{color:#7c3aed}
.subtitle{font-size:13px;color:#7a7a8c;text-align:center;margin-bottom:36px;line-height:1.6}
.form-label{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7a7a8c;margin-bottom:6px;display:block}
.form-input{width:100%;border:2px solid #e4ddd4;border-radius:12px;padding:14px 48px 14px 16px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;outline:none;transition:border-color .15s;color:#1c1c2e;background:#f7f4ef}
.form-input:focus{border-color:#7c3aed;background:#fff}
.field{margin-bottom:16px}
.submit-btn{width:100%;padding:15px;border-radius:12px;border:none;background:#7c3aed;color:white;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;transition:all .18s;margin-top:8px}
.submit-btn:hover{background:#6d28d9;transform:translateY(-1px)}
.submit-btn:disabled{opacity:.6;cursor:default;transform:none}
.msg{margin-top:16px;padding:14px 18px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;display:none;line-height:1.6}
.msg.error{background:#fdecea;color:#b02030;display:block}
.msg.ok{background:#e6f7ee;color:#1a7a45;display:block}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;padding:4px}
.hint{font-size:12px;color:#7a7a8c;margin-top:6px}
.link-btn{display:block;text-align:center;margin-top:18px;font-size:13px;font-weight:700;color:#7c3aed;text-decoration:none}
.link-btn:hover{text-decoration:underline}
#invalid-card{display:none;text-align:center}
.invalid-icon{font-size:48px;margin-bottom:16px}
.invalid-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#1c1c2e;margin-bottom:10px}
.invalid-text{font-size:13px;color:#7a7a8c;line-height:1.7}
#loading-card{text-align:center;font-size:14px;font-weight:700;color:#7a7a8c;padding:20px 0}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Frenchois<span>.</span></div>
  <div class="subtitle">Crea tu nueva contrase&ntilde;a</div>

  <!-- Vérification du lien -->
  <div id="loading-card">Verificando el enlace&hellip;</div>

  <!-- Formulaire nouveau mot de passe -->
  <div id="reset-form" style="display:none">
    <div class="field">
      <label class="form-label">Nueva contrase&ntilde;a</label>
      <div class="pw-wrap">
        <input class="form-input" type="password" id="pw1" placeholder="M&iacute;nimo 8 caracteres" autocomplete="new-password">
        <button class="pw-toggle" type="button" onclick="togglePw()" aria-label="Mostrar contrase&ntilde;a">&#128065;</button>
      </div>
      <div class="hint">M&iacute;nimo 8 caracteres.</div>
    </div>
    <div class="field">
      <label class="form-label">Repite la contrase&ntilde;a</label>
      <div class="pw-wrap">
        <input class="form-input" type="password" id="pw2" placeholder="Repite la contrase&ntilde;a" autocomplete="new-password" onkeydown="if(event.key==='Enter')updatePassword()">
      </div>
    </div>
    <button class="submit-btn" id="submit-btn" onclick="updatePassword()">Guardar contrase&ntilde;a</button>
    <div class="msg" id="msg"></div>
  </div>

  <!-- Lien invalide / expiré -->
  <div id="invalid-card">
    <div class="invalid-icon">&#9888;&#65039;</div>
    <div class="invalid-title">Enlace inv&aacute;lido o caducado</div>
    <div class="invalid-text">
      Este enlace ya no es v&aacute;lido. Los enlaces de recuperaci&oacute;n caducan despu&eacute;s de 1 hora y solo se pueden usar una vez.
    </div>
    <a class="link-btn" href="login.html">&larr; Volver al inicio de sesi&oacute;n</a>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://mvfrirxbhbtenunogdpj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oT738uTwT-dtpbMpWGgFkg_LvODS1a-';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let recoveryReady = false;

function showForm() {
  recoveryReady = true;
  document.getElementById('loading-card').style.display = 'none';
  document.getElementById('invalid-card').style.display = 'none';
  document.getElementById('reset-form').style.display = 'block';
}
function showInvalid() {
  document.getElementById('loading-card').style.display = 'none';
  document.getElementById('reset-form').style.display = 'none';
  document.getElementById('invalid-card').style.display = 'block';
}

// Supabase détecte le lien de récupération dans l'URL et émet PASSWORD_RECOVERY
sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') showForm();
});

// Filet de sécurité : si après 3 s aucun événement, on vérifie la session / l'erreur dans l'URL
setTimeout(async () => {
  if (recoveryReady) return;
  const hash = window.location.hash || '';
  if (hash.includes('error=')) { showInvalid(); return; }
  const { data } = await sb.auth.getSession();
  if (data.session) showForm(); else showInvalid();
}, 3000);

function togglePw() {
  const t = document.getElementById('pw1').type === 'password' ? 'text' : 'password';
  document.getElementById('pw1').type = t;
  document.getElementById('pw2').type = t;
}

async function updatePassword() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');

  if (pw1.length < 8) {
    msg.className = 'msg error';
    msg.textContent = 'La contrase\u00F1a debe tener al menos 8 caracteres.';
    return;
  }
  if (pw1 !== pw2) {
    msg.className = 'msg error';
    msg.textContent = 'Las contrase\u00F1as no coinciden.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Guardando\u2026';
  msg.className = 'msg';

  const { error } = await sb.auth.updateUser({ password: pw1 });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'Guardar contrase\u00F1a';
    msg.className = 'msg error';
    const m = error.message.toLowerCase();
    if (m.includes('different from the old')) {
      msg.textContent = 'La nueva contrase\u00F1a debe ser diferente de la anterior.';
    } else if (m.includes('weak') || m.includes('least')) {
      msg.textContent = 'Contrase\u00F1a demasiado d\u00E9bil. Usa al menos 8 caracteres, con letras y n\u00FAmeros.';
    } else {
      msg.textContent = 'Error: ' + error.message;
    }
    return;
  }

  msg.className = 'msg ok';
  msg.textContent = '\u00A1Contrase\u00F1a actualizada! Redirigiendo\u2026';
  setTimeout(() => { window.location.href = 'index.html'; }, 1500);
}
</script>
</body>
</html>
